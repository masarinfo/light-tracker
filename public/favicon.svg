<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.9" />
    </linearGradient>
  </defs>
  
  <!-- Sleek Rounded Squircle Card -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />
  
  <!-- Gold Coin (Left - Precious Metals) -->
  <circle cx="26" cy="36" r="13" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.9" />
  <circle cx="26" cy="36" r="8" fill="url(#goldGrad)" opacity="0.2" />
  <path d="M26 30v12M20 36h12" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.8" />

  <!-- Cyan Coin (Right - Crypto / Digital Assets) -->
  <circle cx="38" cy="27" r="13" fill="none" stroke="url(#cyanGrad)" stroke-width="3.2" />
  <circle cx="38" cy="27" r="8" fill="url(#cyanGrad)" opacity="0.25" />
  <path d="M38 20v14M31 27h14" stroke="url(#cyanGrad)" stroke-width="2.2" stroke-linecap="round" />
  
  <!-- Glowing Center Spark -->
  <circle cx="32" cy="31.5" r="2.5" fill="#ffffff" />
  <circle cx="32" cy="31.5" r="4.5" fill="#22d3ee" opacity="0.35" />
</svg>
services:
  - type: web
    name: light-tracker-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        # This will be manually updated or dynamically set, but keeping a placeholder for Render URL
        value: https://light-tracker-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: light-tracker-backend
    env: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: light-tracker-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: light-tracker-db
    databaseName: lighttracker
    user: lighttracker_user
